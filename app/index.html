<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Leonida Platinum Codex · GTA VI Trophy Guide &amp; Tracker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class=masthead>
  <a class=brand href=# id=brand aria-label="Leonida Platinum Codex home">
    <svg class=mark viewBox="0 0 40 40" aria-hidden=true><rect width=40 height=40 rx=11 fill="#1b1430"/><circle cx=20 cy=22 r=10 fill="#ff5c8a"/><rect y=22 width=40 height=18 fill="#1b1430"/><path d="M7 25h26M10 29h20M14 33h12" stroke="#38e3cf" stroke-width=2.4 stroke-linecap=round /></svg>
    <span><span class=eyebrow>GTA VI · PS5 trophy guide &amp; tracker</span>
    <h1>Leonida Platinum Codex</h1></span>
  </a>
  <nav class=viewtabs aria-label=Views>
    <button class="tab active" data-view=tracker type=button><kbd>1</kbd>Tracker</button>
    <button class=tab data-view=roadmap type=button><kbd>2</kbd>Roadmap</button>
    <button class=tab data-view=map type=button><kbd>3</kbd>Map</button>
    <button class=tab data-view=audit type=button><kbd>4</kbd>Audit</button>
  </nav>
  <div class=masttools>
    <span class=saved id=saved role=status></span>
    <button class="btn io tab" data-view=backup id=export-progress type=button><kbd>5</kbd>⇅ Export / Import</button>
    <button class="btn toggle" id=spoiler-toggle type=button aria-pressed=false>🛡 Spoilers: <b id=spoiler-state>Off</b></button>
    <button class=btn id=reset-progress type=button>Reset</button>
  </div>
</header>

<main>
  <section class="view stack" id=tracker-view>
    <div class=codex id=codex-strip aria-label="Platinum progress"></div>
    <div class="split tri" id=tracker-split>
      <div class=listpane>
        <div class=filters id=trophy-filters role=group aria-label="Trophy filters"></div>
        <div class=listmeta>
          <span id=list-count>All 55 trophies</span>
          <label class=search><input id=trophy-search type=search placeholder="Search ( / ) · J K · M" autocomplete=off aria-label="Search trophies"></label>
        </div>
        <div class=trophy-list id=trophy-list tabindex=-1></div>
      </div>
      <article class=sidepane id=trophy-detail aria-live=polite></article>
      <aside class=rail id=trophy-rail aria-label="Next up and sources"></aside>
    </div>
  </section>
  <section class="view hidden" id=roadmap-view><div class=roadmap id=roadmap-stages></div><aside class=rmside id=save-guardrails aria-live=polite></aside></section>
  <section class="view hidden" id=map-view></section>
  <section class="view hidden" id=audit-view></section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
