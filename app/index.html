<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Leonida Platinum Codex — GTA VI Trophy Guide &amp; Tracker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class=masthead>
  <a class=brand href=# id=brand aria-label="Leonida Platinum Codex home">
    <span class=mark aria-hidden=true>VI</span>
    <span><span class=eyebrow>55 trophies · 1P 2G 6S 46B · offline</span>
    <h1>GTA VI Trophy Guide <em>&amp; Tracker</em></h1></span>
  </a>
  <div class=masttools>
    <button class="btn toggle" id=spoiler-toggle type=button aria-pressed=false><span>Spoiler Mode</span> <b id=spoiler-state>Off</b></button>
    <button class="btn primary" id=export-progress type=button>Export</button>
    <button class=btn id=import-progress type=button>Import</button>
    <button class=btn id=reset-progress type=button>Reset</button>
  </div>
</header>

<div class=audit id=audit-strip role=status aria-label="Verification audit"></div>

<div class=statusbar>
  <nav class=viewtabs aria-label=Views>
    <button class="tab active" data-view=tracker type=button>Tracker</button>
    <button class=tab data-view=roadmap type=button>Platinum Roadmap</button>
  </nav>
  <div class=progress>
    <div class=ptext><strong id=progress-label>0 of 55 earned</strong><span id=progress-pct>0%</span></div>
    <div class=bar role=progressbar aria-label="Overall completion"><i id=progress-fill></i></div>
  </div>
</div>

<main>
  <section class="view split" id=tracker-view>
    <div class=listpane>
      <div class=filters id=trophy-filters role=group aria-label="Trophy filters"></div>
      <div class=listmeta>
        <span id=list-count>All 55 trophies</span>
        <label class=search><input id=trophy-search type=search placeholder="Search trophies…" autocomplete=off aria-label="Search trophies"></label>
      </div>
      <div class=trophy-list id=trophy-list tabindex=-1></div>
    </div>
    <aside class=sidepane id=trophy-detail aria-live=polite></aside>
  </section>

  <section class="view split hidden" id=roadmap-view>
    <div class=roadmap id=roadmap-stages></div>
    <aside class=sidepane id=save-guardrails aria-live=polite><!-- guardrails + source matrix --></aside>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
